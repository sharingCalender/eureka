spring:
  application:
    name: eureka


---
spring:

  config:
    activate:
      on-profile: dev
    import: optional:configserver:http://${username}:${password}@localhost:9000


---
spring:
  security:
    username: ${secrets.security_username}
    password: ${secrets.security_password}

  config:
    activate:
      on-profile: live

    import: optional:configserver:http://${secrets.username}:${secrets.password}@config-server:9000




